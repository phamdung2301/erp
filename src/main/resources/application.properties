# =============================================
# e-Rescue Platform Configuration
# =============================================
spring.application.name=e-Rescue Platform

# --- Server ---
server.port=8080
server.servlet.session.timeout=30m

# --- PostgreSQL ---
spring.datasource.url=jdbc:postgresql://localhost:5432/rescue
spring.datasource.username=postgres
spring.datasource.password=phamdung.2301
spring.datasource.driver-class-name=org.postgresql.Driver

# --- JPA / Hibernate ---
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# --- Thymeleaf ---
spring.thymeleaf.cache=false
spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html
spring.thymeleaf.encoding=UTF-8

# --- File Upload ---
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
app.upload.dir=uploads

# --- Logging ---
logging.level.web.rescue.erp=DEBUG
logging.level.org.springframework.security=DEBUG

# --- Hibernate Performance Tuning ---
spring.jpa.properties.hibernate.default_batch_fetch_size=50
