<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security" lang="vi">
<head th:replace="~{fragments/layout :: head('Duyệt hồ sơ đối tác')}"></head>
<body class="app-body">

<div th:replace="~{fragments/navbar :: navbar}"></div>

<div class="app-wrapper">
    <div th:replace="~{fragments/sidebar :: sidebar-admin}" th:with="active='verification'"></div>

    <main class="main-content">
        <div class="container-fluid py-4">
            <div class="page-header mb-4">
                <h1 class="page-title"><i class="bi bi-patch-check-fill me-2"></i>Duyệt hồ sơ đối tác</h1>
                <p class="page-subtitle">Xem và phê duyệt hồ sơ đội cứu hộ mới đăng ký</p>
            </div>

            <!-- Pending List -->
            <div th:if="${#lists.isEmpty(pendingRescuers)}" class="card glass-card">
                <div class="card-body text-center py-5">
                    <i class="bi bi-check-circle-fill text-success" style="font-size: 3rem;"></i>
                    <h5 class="mt-3">Không có hồ sơ chờ duyệt</h5>
                    <p class="text-muted">Tất cả hồ sơ đã được xử lý</p>
                </div>
            </div>

            <div class="row g-4" th:unless="${#lists.isEmpty(pendingRescuers)}">
                <div class="col-md-6 col-lg-4" th:each="rp : ${pendingRescuers}">
                    <div class="card glass-card card-hover" th:id="'rescuer-card-' + ${rp.rescuerId}">
                        <div class="card-body">
                            <div class="d-flex align-items-center gap-3 mb-3">
                                <div class="user-avatar-md">
                                    <i class="bi bi-person-fill"></i>
                                </div>
                                <div>
                                    <h6 class="mb-0" th:text="${rp.user.fullName != null ? rp.user.fullName : rp.user.phone}">Tên thợ</h6>
                                    <small class="text-muted" th:text="${rp.user.phone}">SĐT</small>
                                </div>
                            </div>

                            <div class="mb-3">
                                <small class="text-muted d-block mb-1">Chuyên môn:</small>
                                <span th:text="${rp.specialty != null ? rp.specialty : 'Chưa cập nhật'}" class="text-white">-</span>
                            </div>
                            <div class="mb-3">
                                <small class="text-muted d-block mb-1">Khu vực:</small>
                                <span th:text="${rp.serviceArea != null ? rp.serviceArea : 'Chưa cập nhật'}" class="text-white">-</span>
                            </div>
                            <div class="mb-3">
                                <small class="text-muted d-block mb-1">Hồ sơ:</small>
                                <div class="d-flex gap-2">
                                    <span class="badge" th:classappend="${rp.licenseUrl != null} ? 'bg-success' : 'bg-secondary'">
                                        <i class="bi" th:classappend="${rp.licenseUrl != null} ? 'bi-check-lg' : 'bi-x-lg'"></i> GPKD
                                    </span>
                                    <span class="badge" th:classappend="${rp.idCardUrl != null} ? 'bg-success' : 'bg-secondary'">
                                        <i class="bi" th:classappend="${rp.idCardUrl != null} ? 'bi-check-lg' : 'bi-x-lg'"></i> CCCD
                                    </span>
                                </div>
                            </div>

                            <div class="d-flex gap-2 mt-3">
                                 <button type="button" class="btn btn-success flex-fill"
                                         th:data-rescuer-id="${rp.rescuerId}"
                                         onclick="verifyRescuer(event, this.getAttribute('data-rescuer-id'))">
                                     <i class="bi bi-check-lg me-1"></i>Duyệt
                                 </button>
                                 <button type="button" class="btn btn-outline-danger flex-fill"
                                         th:data-rescuer-id="${rp.rescuerId}"
                                         onclick="rejectRescuer(event, this.getAttribute('data-rescuer-id'))">
                                     <i class="bi bi-x-lg me-1"></i>Từ chối
                                 </button>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </main>
</div>

<div th:replace="~{fragments/layout :: toast}"></div>
<div th:replace="~{fragments/layout :: scripts}"></div>
<script th:src="@{/js/admin.js}"></script>
</body>
</html>
