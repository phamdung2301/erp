<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="vi">
<head th:replace="~{fragments/layout :: head('Quên mật khẩu')}"></head>
<body class="auth-body">

<div class="auth-container">
    <div class="auth-brand-panel">
        <div class="auth-brand-content">
            <div class="brand-logo-lg">
                <i class="bi bi-shield-check"></i>
            </div>
            <h1 class="auth-brand-title">e-Rescue</h1>
            <p class="auth-brand-subtitle">Khôi phục tài khoản</p>
        </div>
    </div>

    <div class="auth-form-panel">
        <div class="auth-form-wrapper">
            <div class="auth-form-header">
                <h2>Quên mật khẩu</h2>
                <p>Nhập số điện thoại để nhận mã xác nhận</p>
            </div>

            <div class="form-floating mb-3">
                <input type="text" class="form-control" id="forgotPhone" placeholder="Số điện thoại">
                <label for="forgotPhone"><i class="bi bi-phone me-2"></i>Số điện thoại</label>
            </div>

            <button type="button" class="btn btn-primary btn-lg w-100 btn-gradient" onclick="showToast('Tính năng đang phát triển!', 'info')">
                <i class="bi bi-envelope me-2"></i>Gửi mã xác nhận
            </button>

            <div class="text-center mt-4">
                <a th:href="@{/login}" class="auth-link"><i class="bi bi-arrow-left me-1"></i>Quay lại đăng nhập</a>
            </div>
        </div>
    </div>
</div>

<div th:replace="~{fragments/layout :: scripts}"></div>
</body>
</html>
