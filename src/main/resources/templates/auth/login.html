<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="vi">
<head th:replace="~{fragments/layout :: head('Đăng nhập')}"></head>
<body class="auth-body">

<div class="auth-container">
    <!-- Left Panel - Branding -->
    <div class="auth-brand-panel">
        <div class="auth-brand-content">
            <div class="brand-logo-lg">
                <i class="bi bi-shield-check"></i>
            </div>
            <h1 class="auth-brand-title">e-Rescue</h1>
            <p class="auth-brand-subtitle">Hệ thống Cứu hộ Giao thông Thông minh</p>
            <div class="auth-features">
                <div class="auth-feature-item">
                    <i class="bi bi-lightning-charge-fill"></i>
                    <span>Phản hồi trong 5 phút</span>
                </div>
                <div class="auth-feature-item">
                    <i class="bi bi-geo-alt-fill"></i>
                    <span>Định vị GPS chính xác</span>
                </div>
                <div class="auth-feature-item">
                    <i class="bi bi-robot"></i>
                    <span>AI Chẩn đoán thông minh</span>
                </div>
                <div class="auth-feature-item">
                    <i class="bi bi-shield-lock-fill"></i>
                    <span>Thanh toán minh bạch</span>
                </div>
            </div>
        </div>
    </div>

    <!-- Right Panel - Login Form -->
    <div class="auth-form-panel">
        <div class="auth-form-wrapper">
            <div class="auth-form-header">
                <h2>Chào mừng trở lại!</h2>
                <p>Đăng nhập vào tài khoản của bạn</p>
            </div>

            <!-- Error / Success messages -->
            <div th:if="${error}" class="alert alert-danger alert-dismissible fade show" role="alert">
                <i class="bi bi-exclamation-triangle-fill me-2"></i>
                <span th:text="${error}">Error message</span>
                <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
            </div>
            <div th:if="${message}" class="alert alert-success alert-dismissible fade show" role="alert">
                <i class="bi bi-check-circle-fill me-2"></i>
                <span th:text="${message}">Success message</span>
                <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
            </div>

            <!-- Login Form -->
            <form th:action="@{/login}" method="post" class="auth-form" id="loginForm">
                <div class="form-floating mb-3">
                    <input type="text" class="form-control" id="phone" name="phone"
                           placeholder="Số điện thoại" required autofocus>
                    <label for="phone"><i class="bi bi-phone me-2"></i>Số điện thoại</label>
                </div>

                <div class="form-floating mb-3">
                    <input type="password" class="form-control" id="password" name="password"
                           placeholder="Mật khẩu" required>
                    <label for="password"><i class="bi bi-lock me-2"></i>Mật khẩu</label>
                </div>

                <div class="d-flex justify-content-between align-items-center mb-4">
                    <div class="form-check">
                        <input type="checkbox" class="form-check-input" id="remember" name="remember-me">
                        <label class="form-check-label" for="remember">Ghi nhớ đăng nhập</label>
                    </div>
                    <a th:href="@{/forgot-password}" class="auth-link">Quên mật khẩu?</a>
                </div>

                <button type="submit" class="btn btn-primary btn-lg w-100 btn-gradient" id="btnLogin">
                    <i class="bi bi-box-arrow-in-right me-2"></i>Đăng nhập
                </button>
            </form>

            <!-- Divider -->
            <div class="auth-divider">
                <span>hoặc</span>
            </div>

            <!-- Google Login -->
            <button class="btn btn-outline-light btn-lg w-100 btn-google" disabled>
                <svg width="20" height="20" viewBox="0 0 48 48" class="me-2">
                    <path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"/>
                    <path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z"/>
                    <path fill="#FBBC05" d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.97-6.19z"/>
                    <path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.15 1.45-4.92 2.3-8.16 2.3-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"/>
                </svg>
                Đăng nhập bằng Google
            </button>

            <!-- Register Link -->
            <div class="text-center mt-4">
                <span class="text-muted">Chưa có tài khoản?</span>
                <a th:href="@{/register}" class="auth-link ms-1">Đăng ký ngay</a>
            </div>
        </div>
    </div>
</div>

<div th:replace="~{fragments/layout :: scripts}"></div>
</body>
</html>
