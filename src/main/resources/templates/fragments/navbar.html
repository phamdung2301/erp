<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">

<!-- Top Navbar -->
<nav th:fragment="navbar" class="navbar navbar-expand-lg navbar-dark fixed-top glass-navbar">
    <div class="container-fluid px-4">
        <!-- Brand -->
        <a class="navbar-brand d-flex align-items-center gap-2" href="/dashboard">
            <div class="brand-icon">
                <i class="bi bi-shield-check"></i>
            </div>
            <span class="brand-text">e-Rescue</span>
        </a>

        <!-- Mobile Toggle -->
        <button class="navbar-toggler border-0" type="button" id="sidebarToggle">
            <i class="bi bi-list fs-4"></i>
        </button>

        <!-- Right Side -->
        <div class="d-flex align-items-center gap-3 ms-auto">
            <!-- Notifications -->
            <div class="nav-icon-btn position-relative">
                <i class="bi bi-bell fs-5"></i>
                <span class="notification-badge">3</span>
            </div>

            <!-- User Dropdown -->
            <div class="dropdown" sec:authorize="isAuthenticated()">
                <button class="btn btn-link text-decoration-none d-flex align-items-center gap-2 dropdown-toggle user-dropdown"
                        type="button" data-bs-toggle="dropdown">
                    <div class="user-avatar-sm">
                        <i class="bi bi-person-fill"></i>
                    </div>
                    <span class="d-none d-md-inline text-white" sec:authentication="name">User</span>
                </button>
                <ul class="dropdown-menu dropdown-menu-end glass-dropdown">
                    <li><a class="dropdown-item" href="/profile"><i class="bi bi-person me-2"></i>Hồ sơ</a></li>
                    <li><hr class="dropdown-divider"></li>
                    <li>
                        <form th:action="@{/logout}" method="post">
                            <button type="submit" class="dropdown-item text-danger">
                                <i class="bi bi-box-arrow-right me-2"></i>Đăng xuất
                            </button>
                        </form>
                    </li>
                </ul>
            </div>
        </div>
    </div>
</nav>

</html>
