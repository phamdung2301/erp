# =============================================
# e-Rescue Platform Test Configuration
# =============================================
spring.application.name=e-Rescue Platform (Test)

# --- Server ---
server.servlet.session.timeout=30m

# --- H2 Database (In-Memory) ---
spring.datasource.url=jdbc:h2:mem:erescue_test;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# --- JPA / Hibernate ---
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# --- Thymeleaf ---
spring.thymeleaf.cache=false

# --- File Upload ---
spring.servlet.multipart.enabled=true
app.upload.dir=target/test-uploads

# --- Logging ---
logging.level.web.rescue.erp=DEBUG
logging.level.org.springframework.security=WARN
